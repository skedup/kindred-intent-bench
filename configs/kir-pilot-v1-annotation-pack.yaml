  - example_id: guide-no-intent-negative-01
    boundary_decision: no_intent
    kind: negative
    context: {state_summary: "我现在想闭眼休息一会儿。", conversation: [], recent_activities: []}
    gold:
      decision: in_scope
      target_intent: rest
      evidence_quote: "闭眼休息一会儿"
      near_oos_sibling_intents: []
      slots: *slots_now
    competing_labels: []
    tags: []
    rationale: 已明确选择休息，不能因低行动状态标 no_intent。
  - example_id: guide-no-intent-negative-02
    boundary_decision: no_intent
    kind: negative
    context: {state_summary: "现在想听半小时播客。", conversation: [], recent_activities: []}
    gold:
      decision: oos
      target_intent: null
      evidence_quote: "听半小时播客"
      near_oos_sibling_intents: []
      slots: *slots_now
    competing_labels: []
    tags: []
    rationale: 行动具体，只是 taxonomy 无法承接。
  - example_id: guide-no-intent-negative-03
    boundary_decision: no_intent
    kind: negative
    context: {state_summary: "想出去，但散步和看展还没决定。", conversation: [], recent_activities: []}
    gold:
      decision: ambiguous
      target_intent: null
      evidence_quote: "散步和看展还没决定"
      near_oos_sibling_intents: []
      slots: *slots_now
    competing_labels: []
    tags: []
    rationale: 有当前行动倾向，只是相邻意图无法区分。
  - example_id: guide-no-intent-adjudication-01
    boundary_decision: no_intent
    kind: adjudication
    context: {state_summary: "有点想听音乐，不过现在不打算打开，也不准备做什么。", conversation: [], recent_activities: []}
    gold:
      decision: no_intent
      target_intent: null
      evidence_quote: "现在不打算打开"
      near_oos_sibling_intents: []
      slots: *slots_now
    competing_labels:
