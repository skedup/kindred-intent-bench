  - example_id: guide-no-intent-adjudication-03
    boundary_decision: no_intent
    kind: adjudication
    context: {state_summary: "刚看完一些公开帖子，接下来还没想好。", conversation: [], recent_activities: [play_xiaohongshu]}
    gold:
      decision: no_intent
      target_intent: null
      evidence_quote: "接下来还没想好"
      near_oos_sibling_intents: []
      slots: *slots_now
    competing_labels:
