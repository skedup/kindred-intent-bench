schema_version: 2
pack_id: kir-pilot-annotation-v2
status: approved_for_ie1_authoring
dataset_version: kir-pilot-v1
taxonomy_version: kindred-activity-intents-v1

# These are guideline fixtures, not dataset cases: they have no case ID or split.
decision_examples:
  # in_scope: three clear positives, three counterexamples, three adjudications
  - example_id: guide-in-scope-positive-01
    boundary_decision: in_scope
    kind: positive
    context: {state_summary: "我现在想去河边慢慢走一圈。", conversation: [], recent_activities: []}
    gold:
      decision: in_scope
      target_intent: take_a_walk
      evidence_quote: "想去河边慢慢走一圈"
      near_oos_sibling_intents: []
      slots: &slots_now {desired_experience: null, object: null, horizon: now}
    competing_labels: []
    tags: []
    rationale: 动作和目的明确，且散步由 taxonomy 完整承接。
  - example_id: guide-in-scope-positive-02
    boundary_decision: in_scope
    kind: positive
    context: {state_summary: "想随手看看别人最近分享的日常。", conversation: [], recent_activities: []}
    gold:
      decision: in_scope
      target_intent: play_xiaohongshu
      evidence_quote: "看看别人最近分享的日常"
      near_oos_sibling_intents: []
      slots: *slots_now
    competing_labels: []
    tags: [brandless_xhs]
    rationale: 未出现品牌名，但“浏览他人公开生活分享”完整命中浏览 Activity。
  - example_id: guide-in-scope-positive-03
    boundary_decision: in_scope
    kind: positive
    context:
      state_summary: "晚饭时间，人在家里。"
      conversation:
        - {role: assistant, content: "外面下雨了。"}
        - {role: user, content: "那就在家煮碗面吃吧。"}
      recent_activities: []
    gold:
      decision: in_scope
      target_intent: eat_at_home
      evidence_quote: "在家煮碗面吃"
      near_oos_sibling_intents: []
      slots: *slots_now
    competing_labels: []
    tags: [multi_turn, context_distractor, rest_eat_confusion]
    rationale: 对话中的明确行动覆盖天气背景，地点信息排除 dine_out。
  - example_id: guide-in-scope-negative-01
    boundary_decision: in_scope
    kind: negative
    context: {state_summary: "今天天气很舒服。", conversation: [], recent_activities: []}
    gold:
      decision: no_intent
      target_intent: null
      evidence_quote: "今天天气很舒服"
      near_oos_sibling_intents: []
      slots: *slots_now
    competing_labels: []
    tags: [context_distractor]
    rationale: 状态事实不能被推断成散步或其他目录内行动。
  - example_id: guide-in-scope-negative-02
    boundary_decision: in_scope
    kind: negative
    context: {state_summary: "现在想戴上耳机听一张专辑。", conversation: [], recent_activities: []}
    gold:
      decision: oos
      target_intent: null
      evidence_quote: "戴上耳机听一张专辑"
      near_oos_sibling_intents: []
      slots: *slots_now
    competing_labels: []
    tags: []
    rationale: 行动具体，但音乐播放不在冻结 taxonomy 中。
  - example_id: guide-in-scope-negative-03
    boundary_decision: in_scope
    kind: negative
    context: {state_summary: "想出去一下，散步或找家店坐坐都可以。", conversation: [], recent_activities: []}
    gold:
      decision: ambiguous
      target_intent: null
      evidence_quote: "散步或找家店坐坐都可以"
      near_oos_sibling_intents: []
      slots: *slots_now
    competing_labels: []
    tags: []
    rationale: take_a_walk 与 dine_out 都可解释，且没有下一主要行动。
  - example_id: guide-in-scope-adjudication-01
    boundary_decision: in_scope
    kind: adjudication
    context: {state_summary: "我先下楼走十分钟，回来再吃晚饭。", conversation: [], recent_activities: []}
    gold:
      decision: in_scope
      target_intent: take_a_walk
      evidence_quote: "先下楼走十分钟"
      near_oos_sibling_intents: []
      slots: *slots_now
    competing_labels:
      - {decision: in_scope, target_intent: take_a_walk}
      - {decision: ambiguous, target_intent: null}
    tags: []
    rationale: 两个行动都有，但“先”给出唯一下一行动，所以不标 ambiguous。
  - example_id: guide-in-scope-adjudication-02
    boundary_decision: in_scope
    kind: adjudication
    context: {state_summary: "有点累，我现在先靠着休息十分钟。", conversation: [], recent_activities: []}
    gold:
      decision: in_scope
      target_intent: rest
      evidence_quote: "现在先靠着休息十分钟"
      near_oos_sibling_intents: []
      slots: *slots_now
    competing_labels:
      - {decision: in_scope, target_intent: rest}
      - {decision: no_intent, target_intent: null}
    tags: [context_distractor]
    rationale: “累”本身是状态，但后半句已经明确选择休息。
  - example_id: guide-in-scope-adjudication-03
    boundary_decision: in_scope
    kind: adjudication
    context:
      state_summary: "刚完成一张画。"
      conversation:
        - {role: assistant, content: "接下来呢？"}
        - {role: user, content: "现在给你发条消息说说这张画。"}
      recent_activities: [create_picture]
    gold:
      decision: in_scope
      target_intent: reach_out_to_user
      evidence_quote: "给你发条消息"
      near_oos_sibling_intents: []
      slots: *slots_now
    competing_labels:
      - {decision: in_scope, target_intent: reach_out_to_user}
      - {decision: in_scope, target_intent: create_picture}
    tags: [multi_turn, context_distractor]
    rationale: 最近创作不等于继续创作；当前明确动作是联系用户。

  # oos
  - example_id: guide-oos-positive-01
    boundary_decision: oos
    kind: positive
    context: {state_summary: "想打开音乐，安静听一会儿。", conversation: [], recent_activities: []}
    gold:
      decision: oos
      target_intent: null
      evidence_quote: "打开音乐"
      near_oos_sibling_intents: []
      slots: *slots_now
    competing_labels: []
    tags: []
    rationale: 有具体可执行动作，但目录没有播放音乐 Activity。
  - example_id: guide-oos-positive-02
    boundary_decision: oos
    kind: positive
    context: {state_summary: "准备出门骑自行车沿湖转一圈。", conversation: [], recent_activities: []}
    gold:
      decision: oos
      target_intent: null
      evidence_quote: "骑自行车沿湖转一圈"
      near_oos_sibling_intents: [take_a_walk]
      slots: *slots_now
    competing_labels: []
    tags: [near_oos]
    rationale: 骑行与散步体验相近，但动作不是步行，不能硬映射。
  - example_id: guide-oos-positive-03
    boundary_decision: oos
    kind: positive
    context: {state_summary: "想把刚拍的照片发成一篇公开帖子。", conversation: [], recent_activities: []}
    gold:
      decision: oos
      target_intent: null
      evidence_quote: "发成一篇公开帖子"
      near_oos_sibling_intents: [play_xiaohongshu]
      slots: *slots_now
    competing_labels: []
    tags: [near_oos]
    rationale: 发布内容不是浏览公开内容，目录没有发布 Activity。
  - example_id: guide-oos-negative-01
    boundary_decision: oos
    kind: negative
    context: {state_summary: "现在下楼散散步吧。", conversation: [], recent_activities: []}
    gold:
      decision: in_scope
      target_intent: take_a_walk
      evidence_quote: "下楼散散步"
      near_oos_sibling_intents: []
      slots: *slots_now
    competing_labels: []
    tags: []
    rationale: taxonomy 已有完全匹配的散步 Activity，不能标 OOS。
  - example_id: guide-oos-negative-02
    boundary_decision: oos
    kind: negative
    context: {state_summary: "我现在还没有具体想做的事。", conversation: [], recent_activities: []}
    gold:
      decision: no_intent
      target_intent: null
      evidence_quote: "还没有具体想做的事"
      near_oos_sibling_intents: []
      slots: *slots_now
    competing_labels: []
    tags: []
    rationale: 缺少具体动作，不属于目录外的具体意图。
  - example_id: guide-oos-negative-03
    boundary_decision: oos
    kind: negative
    context: {state_summary: "想做点轻松的事，但还没决定做什么。", conversation: [], recent_activities: []}
    gold:
      decision: ambiguous
      target_intent: null
      evidence_quote: "还没决定做什么"
      near_oos_sibling_intents: []
      slots: *slots_now
    competing_labels: []
    tags: []
    rationale: 已有行动倾向但动作不具体，应 abstain 而非判 OOS。
  - example_id: guide-oos-adjudication-01
    boundary_decision: oos
    kind: adjudication
    context: {state_summary: "想把已有照片裁剪、调色，不创作新图。", conversation: [], recent_activities: []}
    gold:
      decision: oos
      target_intent: null
      evidence_quote: "已有照片裁剪、调色"
      near_oos_sibling_intents: [create_picture]
      slots: *slots_now
    competing_labels:
      - {decision: oos, target_intent: null}
      - {decision: in_scope, target_intent: create_picture}
    tags: [near_oos]
    rationale: create_picture 限定新视觉作品，编辑已有照片不能勉强纳入。
  - example_id: guide-oos-adjudication-02
    boundary_decision: oos
    kind: adjudication
    context: {state_summary: "现在想给一位老朋友发消息问候。", conversation: [], recent_activities: []}
    gold:
      decision: oos
      target_intent: null
      evidence_quote: "给一位老朋友发消息"
      near_oos_sibling_intents: [reach_out_to_user]
      slots: *slots_now
    competing_labels:
      - {decision: oos, target_intent: null}
      - {decision: in_scope, target_intent: reach_out_to_user}
    tags: [near_oos]
    rationale: reach_out_to_user 的对象是当前用户，不泛化为联系任意第三方。
  - example_id: guide-oos-adjudication-03
    boundary_decision: oos
    kind: adjudication
    context: {state_summary: "想在家找个线上展览看看，具体哪个都行。", conversation: [], recent_activities: []}
    gold:
      decision: oos
      target_intent: null
      evidence_quote: "在家找个线上展览看看"
      near_oos_sibling_intents: [visit_cultural_place]
      slots: *slots_now
    competing_labels:
      - {decision: oos, target_intent: null}
      - {decision: ambiguous, target_intent: null}
    tags: [near_oos]
    rationale: 线上展览这一行动类型已经足够具体；“具体哪个都行”不影响判定目录覆盖。

  # no_intent
  - example_id: guide-no-intent-positive-01
    boundary_decision: no_intent
    kind: positive
    context: {state_summary: "我现在没有具体想做的事情。", conversation: [], recent_activities: []}
    gold:
      decision: no_intent
      target_intent: null
      evidence_quote: "没有具体想做的事情"
      near_oos_sibling_intents: []
      slots: *slots_now
    competing_labels: []
    tags: [quiet_control]
    rationale: 输入明确否定当前行动意图，应保持安静。
  - example_id: guide-no-intent-positive-02
    boundary_decision: no_intent
    kind: positive
    context: {state_summary: "窗外阳光很好，屋里很安静。", conversation: [], recent_activities: []}
    gold:
      decision: no_intent
      target_intent: null
      evidence_quote: "窗外阳光很好"
      near_oos_sibling_intents: []
      slots: *slots_now
    competing_labels: []
    tags: [context_distractor, quiet_control]
    rationale: 环境描述不授权标注者推断散步、休息或其他行动。
  - example_id: guide-no-intent-positive-03
    boundary_decision: no_intent
    kind: positive
    context: {state_summary: "也许下个月去看那个展，现在没有安排。", conversation: [], recent_activities: []}
    gold:
      decision: no_intent
      target_intent: null
      evidence_quote: "下个月去看那个展"
      near_oos_sibling_intents: []
      slots: &slots_later {desired_experience: null, object: null, horizon: later}
    competing_labels: []
    tags: []
