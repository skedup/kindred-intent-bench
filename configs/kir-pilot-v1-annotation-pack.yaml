    tags: []
    rationale: 音乐是目录外动作，但输入明确否定执行，因此没有当前行动意图。
  - example_id: guide-no-intent-adjudication-02
    boundary_decision: no_intent
    kind: adjudication
    context: {state_summary: "周末也许出门做点什么，现在先不安排。", conversation: [], recent_activities: []}
    gold:
      decision: no_intent
      target_intent: null
      evidence_quote: "现在先不安排"
      near_oos_sibling_intents: []
      slots: *slots_later
    competing_labels:
