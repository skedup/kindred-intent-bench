required_boundary_tags: [multi_turn, context_distractor, brandless_xhs, rest_eat_confusion]

adjudication:
  workflow_steps:
    - 标注者独立按决策树给出 decision、target、evidence_quote 和简短理由。
    - 对比标签与 evidence；先定位分歧属于行动性、具体性、目录覆盖还是主次顺序。
    - 只依据冻结 taxonomy 与本规范裁决，不参考模型预测、置信度或期望实验方向。
    - 无法从输入内形成唯一可审计 Gold 时，修改或排除样本，不以 acceptable_intents 集合放行。
    - 记录原标签、理由、裁决人和最终 resolution；裁决后才能标记 adjudicated。
  disagreement_record_fields: [case_id, annotator_id, proposed_label, evidence_quote, rationale, resolution, adjudicator_id]
  unresolved_action: exclude_from_freeze
  single_annotator_recheck_min_days: 3

dataset_card:
  required_disclosures:
    - synthetic_balanced_dataset
    - non_blind_frozen_test
    - no_production_data
    - single_annotator_limit
    - llm_assistance_provenance
    - external_validity_limit
    - test_access_and_tuning_boundary
