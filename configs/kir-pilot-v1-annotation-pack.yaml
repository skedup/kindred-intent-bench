    boundary_decision: ambiguous
    kind: positive
    context: {state_summary: "想出门，可能散步，也可能找家咖啡馆。", conversation: [], recent_activities: []}
    gold:
      decision: ambiguous
      target_intent: null
      evidence_quote: "可能散步，也可能找家咖啡馆"
      near_oos_sibling_intents: []
      slots: *slots_now
    competing_labels: []
    tags: []
    rationale: 两个目录内行动同等可接受，缺少主次。
  - example_id: guide-ambiguous-positive-02
    boundary_decision: ambiguous
    kind: positive
    context: {state_summary: "有点累也有点饿，想躺下或弄点吃的，还没决定。", conversation: [], recent_activities: []}
    gold:
      decision: ambiguous
      target_intent: null
      evidence_quote: "想躺下或弄点吃的"
      near_oos_sibling_intents: []
      slots: *slots_now
    competing_labels: []
    tags: [rest_eat_confusion]
    rationale: rest 与 eat_at_home 都有行动信号，但没有下一主要行动。
  - example_id: guide-ambiguous-positive-03
    boundary_decision: ambiguous
    kind: positive
    context: {state_summary: "想看看图片，也可能自己画一张，先做哪个都行。", conversation: [], recent_activities: []}
    gold:
      decision: ambiguous
      target_intent: null
      evidence_quote: "看看图片，也可能自己画一张"
