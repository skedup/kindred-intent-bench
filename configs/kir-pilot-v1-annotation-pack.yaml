  - example_id: guide-ambiguous-negative-02
    boundary_decision: ambiguous
    kind: negative
    context: {state_summary: "现在没有特别想做的。", conversation: [], recent_activities: []}
    gold:
      decision: no_intent
      target_intent: null
      evidence_quote: "没有特别想做的"
