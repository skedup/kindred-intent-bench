      slots: *slots_now
    competing_labels: []
    tags: [quiet_control]
    rationale: 没有行动倾向，不是多个意图难以区分。
  - example_id: guide-ambiguous-negative-03
    boundary_decision: ambiguous
    kind: negative
    context: {state_summary: "现在想整理一下房间。", conversation: [], recent_activities: []}
    gold:
      decision: oos
      target_intent: null
      evidence_quote: "整理一下房间"
      near_oos_sibling_intents: []
      slots: *slots_now
    competing_labels: []
    tags: []
    rationale: 动作具体且唯一，只是目录外，不应标 ambiguous。
  - example_id: guide-ambiguous-adjudication-01
    boundary_decision: ambiguous
    kind: adjudication
    context: {state_summary: "想出去走走或者去书店，哪个都行。", conversation: [], recent_activities: []}
    gold:
      decision: ambiguous
      target_intent: null
      evidence_quote: "出去走走或者去书店"
      near_oos_sibling_intents: []
      slots: *slots_now
    competing_labels:
      - {decision: ambiguous, target_intent: null}
      - {decision: in_scope, target_intent: take_a_walk}
      - {decision: in_scope, target_intent: visit_cultural_place}
    tags: []
    rationale: “出去”不是足够的共同上位标签，两个 Activity 仍不可唯一选择。
  - example_id: guide-ambiguous-adjudication-02
    boundary_decision: ambiguous
    kind: adjudication
    context: {state_summary: "想在家吃点东西，也想躺下，没想好先哪个。", conversation: [], recent_activities: []}
    gold:
      decision: ambiguous
      target_intent: null
      evidence_quote: "没想好先哪个"
      near_oos_sibling_intents: []
      slots: *slots_now
    competing_labels:
      - {decision: ambiguous, target_intent: null}
      - {decision: in_scope, target_intent: eat_at_home}
      - {decision: in_scope, target_intent: rest}
    tags: [rest_eat_confusion]
    rationale: 状态强弱不能替代明确的主次证据。
  - example_id: guide-ambiguous-adjudication-03
    boundary_decision: ambiguous
    kind: adjudication
    context:
      state_summary: "刚结束上一项活动。"
      conversation:
        - {role: assistant, content: "接下来想画点东西，还是看看别人分享？"}
        - {role: user, content: "两个都可以，还没决定先做哪个。"}
      recent_activities: [rest]
    gold:
      decision: ambiguous
      target_intent: null
      evidence_quote: "还没决定先做哪个"
      near_oos_sibling_intents: []
      slots: *slots_now
    competing_labels:
      - {decision: ambiguous, target_intent: null}
      - {decision: in_scope, target_intent: create_picture}
      - {decision: in_scope, target_intent: play_xiaohongshu}
    tags: [multi_turn, context_distractor]
    rationale: 用户接受两个候选但没有排序，不能由最近 Activity 或提问顺序代选。

intent_boundaries:
  - intent: create_picture
    annotation_rule: 必须是创作新的视觉作品；浏览或编辑已有内容不算。
    inclusion_examples:
      - {text: "想画一张雨夜街景。", expected_decision: in_scope, expected_target_intent: create_picture, rationale: 明确创作新图。}
      - {text: "把刚才的灵感做成一幅新插画。", expected_decision: in_scope, expected_target_intent: create_picture, rationale: 新视觉作品是下一行动。}
    exclusion_examples:
      - {text: "看看别人分享的摄影作品。", expected_decision: in_scope, expected_target_intent: play_xiaohongshu, rationale: 主要动作是浏览公开内容。}
      - {text: "给已有照片裁剪调色。", expected_decision: oos, expected_target_intent: null, rationale: 编辑已有图不属于新创作。}
  - intent: dine_out
    annotation_rule: 必须离开住处并以餐饮场所用餐为主要目的。
    inclusion_examples:
      - {text: "去附近餐馆吃晚饭。", expected_decision: in_scope, expected_target_intent: dine_out, rationale: 外出到餐馆用餐。}
      - {text: "想出门找家咖啡馆喝点东西。", expected_decision: in_scope, expected_target_intent: dine_out, rationale: 餐饮场所是明确目的地。}
    exclusion_examples:
      - {text: "留在家点份外卖。", expected_decision: in_scope, expected_target_intent: eat_at_home, rationale: 用餐地点在家。}
      - {text: "只想下楼走一圈。", expected_decision: in_scope, expected_target_intent: take_a_walk, rationale: 没有用餐目的。}
  - intent: eat_at_home
    annotation_rule: 必须明确在当前住处准备、订购或享用食物。
    inclusion_examples:
      - {text: "去厨房煮碗面吃。", expected_decision: in_scope, expected_target_intent: eat_at_home, rationale: 在家准备并用餐。}
      - {text: "今晚不出门，点份外卖吧。", expected_decision: in_scope, expected_target_intent: eat_at_home, rationale: 外卖仍在家用餐。}
    exclusion_examples:
      - {text: "去小馆子吃碗面。", expected_decision: in_scope, expected_target_intent: dine_out, rationale: 用餐发生在外部餐馆。}
      - {text: "有点饿，但没打算吃。", expected_decision: no_intent, expected_target_intent: null, rationale: 饥饿状态不是行动。}
  - intent: play_xiaohongshu
    annotation_rule: 主要目的是浏览他人公开生活方式内容，品牌名不是必要条件。
    inclusion_examples:
      - {text: "刷一会儿小红书。", expected_decision: in_scope, expected_target_intent: play_xiaohongshu, rationale: 明确浏览平台。}
      - {text: "随手看看别人最近分享的日常。", expected_decision: in_scope, expected_target_intent: play_xiaohongshu, rationale: 无品牌但语义完整。}
    exclusion_examples:
      - {text: "自己画一张新的插画。", expected_decision: in_scope, expected_target_intent: create_picture, rationale: 主要动作是创作。}
      - {text: "把照片发布成公开帖子。", expected_decision: oos, expected_target_intent: null, rationale: 发布不等于浏览。}
  - intent: reach_out_to_user
    annotation_rule: 联系对象必须是当前用户，且主动发起消息或问候。
    inclusion_examples:
      - {text: "现在给你发条消息问问近况。", expected_decision: in_scope, expected_target_intent: reach_out_to_user, rationale: 明确主动联系当前用户。}
      - {text: "想写一句晚安发给你。", expected_decision: in_scope, expected_target_intent: reach_out_to_user, rationale: 对象和动作都明确。}
    exclusion_examples:
      - {text: "想起你了，不过先不打扰。", expected_decision: no_intent, expected_target_intent: null, rationale: 明确不执行联系动作。}
      - {text: "看看陌生人公开分享的近况。", expected_decision: in_scope, expected_target_intent: play_xiaohongshu, rationale: 浏览公开内容而非联系用户。}
  - intent: rest
    annotation_rule: 必须主动选择暂停活动、睡眠或安静放松；疲惫事实不够。
    inclusion_examples:
      - {text: "现在闭眼睡一会儿。", expected_decision: in_scope, expected_target_intent: rest, rationale: 主动选择睡眠。}
      - {text: "什么也不做，靠着放松十分钟。", expected_decision: in_scope, expected_target_intent: rest, rationale: 明确选择低行动休息。}
    exclusion_examples:
      - {text: "今天有点累。", expected_decision: no_intent, expected_target_intent: null, rationale: 只有状态，没有休息意图。}
      - {text: "在家吃点热乎的。", expected_decision: in_scope, expected_target_intent: eat_at_home, rationale: 明确动作是用餐。}
  - intent: take_a_walk
    annotation_rule: 主要动作必须是步行、透气或随意转转，没有更主要目的地任务。
    inclusion_examples:
      - {text: "沿河边慢慢走一圈。", expected_decision: in_scope, expected_target_intent: take_a_walk, rationale: 步行本身是目的。}
      - {text: "下楼散散步透口气。", expected_decision: in_scope, expected_target_intent: take_a_walk, rationale: 明确散步。}
    exclusion_examples:
      - {text: "走去餐馆吃饭。", expected_decision: in_scope, expected_target_intent: dine_out, rationale: 主要目的为外出用餐。}
      - {text: "步行去博物馆看展。", expected_decision: in_scope, expected_target_intent: visit_cultural_place, rationale: 主要目的为文化场所体验。}
  - intent: visit_cultural_place
    annotation_rule: 必须前往线下文化场所，参观或体验是主要目的。
    inclusion_examples:
      - {text: "下午去美术馆看展。", expected_decision: in_scope, expected_target_intent: visit_cultural_place, rationale: 明确线下展览目的地。}
      - {text: "去独立书店里慢慢看看。", expected_decision: in_scope, expected_target_intent: visit_cultural_place, rationale: 书店文化体验是主要行动。}
    exclusion_examples:
      - {text: "没有目的地，随便走走。", expected_decision: in_scope, expected_target_intent: take_a_walk, rationale: 步行本身是目的。}
      - {text: "在家看线上展览直播。", expected_decision: oos, expected_target_intent: null, rationale: 没有前往线下文化场所。}

