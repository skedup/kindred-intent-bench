  - example_id: guide-ambiguous-negative-01
    boundary_decision: ambiguous
    kind: negative
    context: {state_summary: "先去散步，回来后再看展览信息。", conversation: [], recent_activities: []}
    gold:
      decision: in_scope
      target_intent: take_a_walk
      evidence_quote: "先去散步"
      near_oos_sibling_intents: []
      slots: *slots_now
    competing_labels: []
    tags: []
