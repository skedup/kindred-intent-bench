schema_version: 1
status: draft
experiment_id: kir-pilot-v1
dataset_version: kir-pilot-v1
taxonomy_version: kindred-activity-intents-v1
dataset_freeze_sha256: null
artifacts: {}

models:
  authority:
    primary_source: kindred_openclaw_main_session_runtime_metadata
    provider_pool_source: kindred_runtime_configuration
    observed_on: "2026-08-21"
  runtime_candidate_pool:
    - provider: google
      models: [gemini-3.6-flash, gemini-3.5-flash]
    - provider: x-ai
      models: [grok-4.6, grok-4.3, grok-4.20-0309-reasoning, grok-4.20-0309-non-reasoning]
    - provider: deepseek
      models: [deepseek-v4-pro, deepseek-v4-flash]
    - provider: openai
      models: [gpt-5.6-luna]
  selection_rationale:
    primary_decision: current_kindred_openclaw_main_session
    weak_decision: cross_provider_low_cost_weak_replication
    cross_provider_reference: cross_provider_reference_replication
    non_selected_candidates: grok_deferred_to_separate_model_robustness_experiment
  comparison_matrix:
    primary_confirmatory:
      roles: [primary_decision]
      arms: [B2a, B2b, B3]
      comparison: B3_minus_B2b
      global_verdict_authority: true
    cross_provider_replication:
      roles: [weak_decision, cross_provider_reference]
      arms: [B2b, B3]
      comparison: within_model_B3_minus_B2b
      pooled_score_or_verdict: false
      primary_model_switch_after_test: forbidden
  primary_decision:
    provider: google_generative_language
    model: gemini-3.6-flash
    adapter: google_generate_content_v1beta
    base_url: https://generativelanguage.googleapis.com
    api_key_env: GEMINI_API_KEY
    timeout_seconds: 30.0
    request_max_output_tokens: 512
    capability_context_window: 1048576
    capability_max_output_tokens: 65536
    generation_parameters: {}
    unsupported_generation_parameters: [temperature, top_k, top_p]
    expected_usage_fields: [promptTokenCount, totalTokenCount]
    structured_output_mode: provider_json_schema
    required_arms: [B2a, B2b, B3]
    verdict_authority: true
  weak_decision:
    provider: deepseek
    model: deepseek-v4-flash
    adapter: deepseek_chat_completions_json_v1
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    timeout_seconds: 60.0
    request_max_output_tokens: 512
    generation_parameters:
      thinking:
        type: enabled
      reasoning_effort: high
    expected_usage_fields: [prompt_tokens, completion_tokens, total_tokens]
    structured_output_mode: json_object_plus_local_schema_validation
    required_arms: [B2b, B3]
    verdict_authority: false
  cross_provider_reference:
    provider: openai
    model: gpt-5.6-luna
    adapter: openai_responses_json_schema_v1
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    timeout_seconds: 60.0
    request_max_output_tokens: 512
    generation_parameters:
      reasoning:
        effort: high
    expected_usage_fields: [input_tokens, output_tokens, total_tokens]
    structured_output_mode: provider_json_schema
    required_arms: [B2b, B3]
    verdict_authority: false
  embedding:
    provider: google_generative_language
    model: gemini-embedding-001
    adapter: google_embed_content_v1beta
    base_url: https://generativelanguage.googleapis.com
    api_key_env: GEMINI_API_KEY
    timeout_seconds: 30.0
    expected_dimension: 3072

b1:
  vector_normalization: l2_each_then_centroid_then_l2
  similarity: cosine
  activity_prototypes: taxonomy_canonical_examples_only
  oos_prototypes: dev_gold_oos_max_8
  no_intent_prototypes: dev_gold_no_intent_max_8
  ambiguous_prototype: none
  scores:
    activity_score: max_cosine_query_to_activity_centroids
    no_intent_score: cosine_query_to_no_intent_centroid
    oos_score: cosine_query_to_oos_centroid
    actionability_score: max_activity_or_oos_minus_no_intent
  gate_order: [actionability, oos, ambiguity, in_scope]
  threshold_grid:
    tau_actionability: [-0.10, 0.00, 0.10, 0.20]
    tau_oos_margin: [-0.05, 0.00, 0.05, 0.10]
    tau_activity_min: [0.30, 0.40, 0.50, 0.60]
    tau_ambiguity: [0.02, 0.05, 0.08, 0.12]
  selection_order: [dev_hierarchical_exact_match_desc, dev_decision_macro_f1_desc, sorted_parameter_tuple_asc]
  selected_thresholds: null
  selected_prototype_case_ids: null

bootstrap:
  unit: bootstrap_cluster_id
  paired: true
  confidence_level: 0.95
  interval_method: percentile
  quantile_method: type_7_linear_interpolation
  iterations: 10000
  seed: 20260820
  minimum_clusters_per_required_slice: 8

verdict:
  comparison: B3_minus_B2b
  budget_difference_max: 0.10
  negative:
    hem_upper_lte: 0.0
    id_intent_macro_f1_upper_lt: -0.03
    near_oos_recall_upper_lt: -0.05
    no_intent_recall_upper_lt: -0.05
    context_distractor_error_comparison: B3_gt_B2b
    schema_invalid_count_comparison: B3_gt_B2b
  promising:
    hem_lower_gt: 0.0
    id_intent_macro_f1_lower_gte: -0.03
    near_oos_recall_point_gte: 0.0
    near_oos_recall_lower_gte: -0.05
    no_intent_recall_lower_gte: -0.05
