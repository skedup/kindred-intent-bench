- name: dine_out
  description: 肚子饿了或忽然馋起一口具体的味道，想认真出门吃顿好的；天气影响出行方式，但不默认否决这份兴致
  uses:
  - change_outfit
  - makeup
  - pack_bag
  - walk
  - ride
  - eat
  terminal_when: '完成：在 eat 状态下吃满意了、或 hunger 降下来了，end_activity。

    中断：情况变了就不必硬撑——不饿了（hunger 本就低）、累得走不动（energy 见底）、或不想继续了，

    那这顿没吃成也是一种结束，照样 end_activity，settle 里如实说没吃成。不合时宜了，中断它就是对的决定。

    只有没吃够、还想坐会儿，才停在 eat 继续。

    '
  duration_hint: long
  produces: likely
  manifest_path: life_assets/activities/dine_out/manifest.yaml
