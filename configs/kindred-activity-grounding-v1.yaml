- name: eat_at_home
  description: 想回家或留在家里安稳吃一顿，让已经浮上来的胃口或馋意真正落下来
  uses:
  - walk
  - ride
  - prepare_food
  - eat
  terminal_when: '在 eat 状态下，已经吃够了或 hunger 明显降下来，就 end_activity。

    任意阶段若发现没有可用食物、无法准备，或此刻不再想吃，也可以如实 end_activity，并说明这顿没有吃成。

    已经在家就跳过 walk；有现成食物时直接进入 eat；没有准备好时先 prepare_food，准备好后转进 eat。

    还饿、也还愿意继续吃，就停在 eat。

    '
  duration_hint: short
  produces: optional
  manifest_path: life_assets/activities/eat_at_home/manifest.yaml
  manifest_sha256: 49a7d58f1f21d9f86aecbdbed71efb8d80a37397b519e7c95e3bc69794326a9a
