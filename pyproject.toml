[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kindred-intent-bench"
version = "0.1.0"
description = "Offline open-set intent recognition workbench for Kindred activity routing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "UNLICENSED" }
dependencies = [
  "click>=8.1,<9",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pyyaml>=6.0,<7",
]

[project.scripts]
intentbench = "intentbench.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "ruff>=0.6,<1",
  "types-pyyaml>=6.0,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/intentbench"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
warn_unreachable = true
